; PlatformIO Project Configuration
; Greenhouse Ventilation Controller — v2.0.0 series (ESP-IDF migration)
; Target board: WEMOS LOLIN S3 (ESP32-S3, 16 MB flash, 8 MB PSRAM)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; ============================================================================
; ESP-IDF migration note (Phase 1, 2.0.0-alpha.1)
; ============================================================================
; This branch flips `framework = arduino` to `framework = espidf`. The build
; system change is the highest-risk single step in the entire migration plan
; (see `~/.claude/plans/do-not-make-changes-toasty-salamander.md` for the
; full phase breakdown).
;
; Phase 1 acceptance bar: a minimal heartbeat task (src/app_main_stub.cpp)
; boots cleanly and emits a serial log line every 5 s for at least 1 hour
; without resetting. Everything else is intentionally NOT compiled — the
; existing files in `firmware/src/<subdir>/*.cpp` remain on disk but are
; excluded from the build by `src/CMakeLists.txt` (which only lists the
; stub). They get re-introduced in Phases 2-6 as each subsystem migrates.
;
; The `test_t2_relay` env is commented out for the duration of Phases 1-2;
; it depends on the Arduino Unity test framework infrastructure. Phase 2
; will re-enable it under framework=espidf using ESP-IDF's native Unity.
; ============================================================================

[platformio]
default_envs = lolin_s3

[env:lolin_s3]
; Pinned 1.18.2 (gh#20). Same platform pin as 1.20.3 — only the framework
; selection changes. See design/tls_leak_audit.md before bumping.
platform  = espressif32@6.12.0
board     = lolin_s3
framework = espidf

; Serial monitor — DTR=1 asserts "host connected" to the ESP32-S3 USB-CDC
; so log lines work when the monitor is open.
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 0

; Upload via USB (native USB-C port on LOLIN S3)
upload_protocol = esptool

; Our custom partition table places app0 at 0x20000 (not the default 0x10000).
; Layout: otadata at 0xe000 (standard esptool target), NVS at 0x10000 (64 KB),
; then app0 at 0x20000.  Without board_upload.offset_address = 0x20000, esptool
; writes the firmware to 0x10000 (clobbering NVS) → crash loop.
board_upload.offset_address = 0x20000

; Custom partition table (dual OTA banks + dual LittleFS + coredump).
; Same file as 1.20.3 — verified compatible with both arduino and espidf
; frameworks.
board_build.partitions = partitions.csv

; Flash mode: qio at runtime (matches 1.20.3 working config; the
; --flash_mode dio note in the user-memory rule is for esptool's full-
; flash header byte, distinct from the runtime mode set here).
board_build.flash_mode = qio

; Build flags (global — applied to ALL compile units including IDF internals).
;
; Tier-1 hardening flags (gh#13, 1.17.29) used to live here. Under arduino-esp32
; they were tolerable because the framework was distributed as a precompiled
; library — these flags only applied to our own source files. Under framework=
; espidf the IDF *sources* are compiled from scratch in our build, and several
; strict warnings (-Wshadow, -Wlogical-op, -Wnull-dereference, -Wstack-usage)
; trip on internal IDF code (esp_wps.c, esp_async_memcpy.c, lwIP, mbedtls, …)
; that we do not want to patch.
;
; The hardening flags are reintroduced PER-COMPONENT via
; `target_compile_options` in firmware/src/CMakeLists.txt and (eventually)
; each driver's CMakeLists.txt. Keep this build_flags list minimal so it
; doesn't poison the IDF component graph.
;
; Restored hardening flags target list (see firmware/src/CMakeLists.txt):
;   -Wall -Wextra -Wformat=2 -Wshadow -Wstack-usage=2200
;   -Wlogical-op -Wstrict-overflow=2 -Wnull-dereference
; (note: -D_FORTIFY_SOURCE=2 dropped entirely — it redefines `memcpy` as a
;  macro that collides with ESP-IDF's struct-field name `memcpy` in
;  esp_async_memcpy.c. Revisit with a per-file opt-out if we want it back.)
build_flags =
    -Iconfig
    ; -DCONFIG_NVS_LOG_CAPACITY removed in 2.0.0-alpha.6.5 — the NVS-backed
    ; event-log ringbuffer it sized (gh#22) was retired as redundant with
    ; T9's SD-card CSV logging. See changelog [2.0.0-alpha.6.5] for the
    ; design-change rationale and follow-up doc updates.
    -DFIRMWARE_VERSION=\"2.0.0-alpha.6.7.1\"

; -----------------------------------------------------------------------------
; Static analyser (pio check), since 1.17.29 / gh#13.
; Run with:  pio check -e lolin_s3
; -----------------------------------------------------------------------------
check_tool = cppcheck
check_flags =
    --enable=all
    --suppress=missingIncludeSystem
    --suppress=unusedFunction
    --inline-suppr
check_severity   = medium, high
check_src_filters =
    +<src/>
    +<../drivers/>
    -<.pio/>

; =============================================================================
; T2 Relay Controller on-device integration test environment
;
; DISABLED FOR ESP-IDF MIGRATION (Phase 1 / 2.0.0-alpha.1).
;
; This environment uses PlatformIO's Arduino Unity wrapper; it does not work
; under framework=espidf in its current form. Phase 2 (driver migration) will
; either re-enable it under espidf using ESP-IDF's native Unity test runner
; or carve the on-device tests off into a separate command structure.
;
; To restore the 1.20.3 test behaviour temporarily, check out the
; `v1.20.3-arduino-final` tag.
; =============================================================================

; [env:test_t2_relay]
; platform  = espressif32@6.12.0
; board     = lolin_s3
; framework = arduino
; ... (kept in git history at v1.20.3-arduino-final tag)
