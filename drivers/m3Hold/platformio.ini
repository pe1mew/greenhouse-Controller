; drivers/m3Hold — the LCD's tap-or-hold timing for M3's Open and Close keys (gh#93)
;
; Pure logic: no FreeRTOS, no ESP-IDF, no project headers, by the rule of
; drivers/ventModel and drivers/m3Char. T8 (ui_display) feeds it the key events
; and carries out the one action each returns. Design: design/lcdM3HoldControl.md.
;
; Host unit tests (no hardware):
;     pio test -e native
;
; There is no lolin_s3 environment here on purpose -- there is nothing to
; exercise on a board that the host cannot exercise faster.

[env:native]
platform       = native
build_flags    = -DUNIT_TEST -DNATIVE_TEST -I src -Wall -Wextra
test_framework = unity
test_filter    = test_m3_hold*
build_type     = release
; Nothing to mock, so the library is compiled straight into the test build,
; as drivers/m3Char's is.
test_build_src = yes
; Point at the Code::Blocks MinGW toolchain, as the other driver libraries do.
extra_scripts  = pre:set_compiler.py
