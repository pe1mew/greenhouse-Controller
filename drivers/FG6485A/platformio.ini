[env]
build_flags = -I../../firmware/config

; ---------------------------------------------------------------------------
; lolin_s3 — manual hardware-verification sketch
;
; Flashes src/main.cpp which exercises all FG6485A driver functions against
; a real sensor on the RS-485 bus and prints PASS / FAIL to UART0.
;
; Hardware wiring:
;   FG6485A A+ (yellow) → RS-485 A+   B- (white) → RS-485 B-
;   FG6485A V+ (red)    → 9–36 V DC   GND (black) → GND
;   SIT65HVD08P DI      → GPIO 17 (PIN_RS485_TX)
;   SIT65HVD08P RO      → GPIO 18 (PIN_RS485_RX)
;   SIT65HVD08P DE+RE   → GPIO 8  (PIN_RS485_DE_RE)
;
; Sensor DIP switch must be set to address 1 (switch H = ON, rest OFF).
;
; Build and upload:  pio run -e lolin_s3 --target upload
; Read output:       pio device monitor  (115200 baud)
; ---------------------------------------------------------------------------
[env:lolin_s3]
platform        = espressif32
board           = lolin_s3
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
build_flags     = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps        =
    file://../gpio
    file://../modBus

; ---------------------------------------------------------------------------
; native — host-side unit tests (no hardware required)
;
; Compiles fg6485a.cpp with mock modbus stubs so all code paths can be
; exercised on the developer's PC without any board attached.
; NATIVE_TEST suppresses Arduino / FreeRTOS includes inside the driver.
;
; Run with:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform         = native
build_flags      = ${env.build_flags} -DUNIT_TEST -DNATIVE_TEST -I test/test_fg6485a -I ../modBus/src
test_framework   = unity
test_filter      = test_fg6485a
build_type       = release
extra_scripts    = pre:set_compiler.py
; Pull in mock and the library source via include_lib.cpp — exclude everything
; from src/ (Arduino code) so only the test glue is compiled directly.
build_src_filter = -<*> +<../test/test_fg6485a/mock_modbus.cpp> +<../test/test_fg6485a/include_lib.cpp>
