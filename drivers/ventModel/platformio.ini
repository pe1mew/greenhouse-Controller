; drivers/ventModel — the T6 ventilation control model (mode 1 + mode 2)
;
; Pure computation: no bus, no GPIO, no ESP-IDF, and deliberately NO
; -I../../firmware/config. A model reads nothing but its input struct, which is
; what keeps the same sources usable in the firmware, in these host tests and
; in the offline replay. See design/ventModelContract.md §4.
;
; Host unit tests (no hardware):
;     pio test -e native
;
; There is no lolin_s3 environment here on purpose — there is nothing to
; exercise on a board that the host cannot exercise faster.

[env:native]
platform       = native
build_flags    = -DUNIT_TEST -DNATIVE_TEST -I src -Wall -Wextra
test_framework = unity
test_filter    = test_vent_model*
build_type     = release
; The model is compiled straight into the test build. The other driver
; libraries here route their source through a test-local include_lib.cpp
; instead, because they need mock headers substituted for Arduino or ESP-IDF
; ones; this one has nothing to mock, so the plain path is the honest one.
test_build_src = yes
; Point at the Code::Blocks MinGW toolchain, as the other driver libraries do.
extra_scripts  = pre:set_compiler.py
