[env]
build_flags = -I../../firmware/config

; ---------------------------------------------------------------------------
; lolin_s3 — manual hardware-verification sketch
;
; Flashes src/main.cpp, which sends real FC03 / FC04 requests over RS485
; and prints PASS / FAIL to UART0 (GPIO 43 TX / 44 RX, 115200 baud).
;
; Requires a Modbus RTU slave on the RS485 bus:
;   Address 1 — holding registers 0-1: { 0x1234, 0x5678 }
;   Address 2 — input   registers 0-1: { 0x00E6, 0x028F }
;   e.g. run a pymodbus slave on a PC connected via a USB-RS485 adapter.
;
; Build and upload:  pio run -e lolin_s3 --target upload
; Read output:       open a serial monitor at 115200 on COM3
; ---------------------------------------------------------------------------
[env:lolin_s3]
platform        = espressif32
board           = lolin_s3
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
build_flags     = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps        = file://../gpio

; ---------------------------------------------------------------------------
; native — host-side unit tests (no hardware required)
;
; Compiles modbus_rtu.cpp with mock UART and GPIO headers so every code
; path can be exercised on the developer's PC without any board attached.
; NATIVE_TEST is defined here so source files select mock headers instead
; of Arduino headers.  UNIT_TEST is also set automatically by PlatformIO
; whenever `pio test` is invoked.
;
; Run with:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform         = native
build_flags      = ${env.build_flags} -DUNIT_TEST -DNATIVE_TEST -I test/test_modbus_rtu
test_framework   = unity
test_filter      = test_modbus_rtu
; Point to Code::Blocks MinGW installation
build_type       = release
extra_scripts    = pre:set_compiler.py
; Exclude everything from src/ and pull in only the native mock/helper files.
build_src_filter = -<*> +<../test/test_modbus_rtu/mock_uart.cpp> +<../test/test_modbus_rtu/mock_gpio.cpp> +<../test/test_modbus_rtu/include_lib.cpp>

; ---------------------------------------------------------------------------
; lolin_s3_loopback — automated hardware loopback test (no slave required)
;
; Uses three jumper wires to route RS485 signals back into spare GPIO pins
; so that a second on-board UART can act as both sniffer and responder.
; Unity reports PASS / FAIL for every signal path and DE/RE timing.
;
; Required jumper wires (fit before running):
;   GPIO 17  ──►  GPIO 38   (MODBUS TX  → UART2 RX sniff)
;   GPIO 18  ◄──  GPIO 21   (MODBUS RX  ← UART2 TX inject)
;   GPIO  8  ──►  GPIO 16   (RS485 DE/RE → GPIO input monitor)
;
; Run with:  pio test -e lolin_s3_loopback
; ---------------------------------------------------------------------------
[env:lolin_s3_loopback]
platform        = espressif32
board           = lolin_s3
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
build_flags     = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps        = file://../gpio
test_framework  = unity
test_filter     = test_hw_loopback
