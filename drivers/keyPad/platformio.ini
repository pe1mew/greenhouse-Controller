[env]
build_flags = -I../../firmware/config

[env:lolin_s3]
platform        = espressif32
board           = lolin_s3
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
build_flags     = ${env.build_flags} -DCORE_DEBUG_LEVEL=3

[env:native]
platform        = native
build_flags     = ${env.build_flags} -DUNIT_TEST -I test
test_framework  = unity
build_type      = release
extra_scripts   = pre:set_compiler.py
; Pull in the implementation and the mock; test file is discovered automatically
build_src_filter = -<*> +<../test/mock_keypad.cpp> +<../test/include_lib.cpp>
