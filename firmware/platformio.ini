; PlatformIO Project Configuration
; Greenhouse Ventilation Controller
; Target board: WEMOS LOLIN S3 (ESP32-S3, 16 MB flash, 8 MB PSRAM)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:lolin_s3]
platform  = espressif32
board     = lolin_s3
framework = arduino

; Serial monitor
monitor_speed = 115200

; Upload via USB (native USB-C port on LOLIN S3)
upload_protocol = esptool

; Custom partition table (dual OTA banks + dual LittleFS partitions)
board_build.partitions = partitions.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Iconfig

; Library dependencies (add as required)
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3   ; WS2812B RGB LED on GPIO38 (PIN_RGB_LED) via RMT
; Drivers below are custom (in drivers/) — not from registry:
;     4-20mA/ModbusMaster @ ^2.0.1
;     marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
;     adafruit/RTClib @ ^2.1.4
