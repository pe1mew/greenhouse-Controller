[env]
build_flags = -I../../firmware/config

[env:lolin_s3]
platform        = espressif32
board           = lolin_s3
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
build_flags     = ${env.build_flags} -DCORE_DEBUG_LEVEL=3
lib_deps        = file://../i2c

[env:native]
platform        = native
; test/include_lib.cpp compiles the ESP-IDF branch of lcd1602.cpp: test/mock_idf
; stands in for the FreeRTOS headers, ../i2c/src supplies the real i2c_bus.h,
; and test/mock_i2c_bus.cpp + mock_freertos.cpp simulate the bus, the chips and time.
build_flags     = ${env.build_flags} -DUNIT_TEST -I test -I test/mock_idf -I ../i2c/src
test_framework  = unity
; Point to Code::Blocks MinGW installation
build_type      = release
extra_scripts   = pre:set_compiler.py
; For native environment: Use `pio test -e native` (not `pio run -e native`)
; This excludes src files since they require the ESP-IDF framework
build_src_filter = -<*> +<../test/mock_i2c_bus.cpp> +<../test/mock_freertos.cpp> +<../test/include_lib.cpp>
