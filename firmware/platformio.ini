; PlatformIO Project Configuration
; Greenhouse Ventilation Controller
; Target board: WEMOS LOLIN S3 (ESP32-S3, 16 MB flash, 8 MB PSRAM)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

; Only build/upload the production firmware by default.
; The test_t2_relay environment is used exclusively via:
;   pio test -e test_t2_relay
[platformio]
default_envs = lolin_s3

[env:lolin_s3]
platform  = espressif32
board     = lolin_s3
framework = arduino

; Serial monitor — DTR=1 asserts "host connected" to the ESP32-S3 USB-CDC
; so Serial.print() calls work when the monitor is open.
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 0

; Upload via USB (native USB-C port on LOLIN S3)
upload_protocol = esptool

; Our custom partition table places app0 at 0x20000 (not the default 0x10000).
; Layout: otadata at 0xe000 (standard esptool target), NVS at 0x10000 (64 KB),
; then app0 at 0x20000.  Without board_upload.offset_address = 0x20000, esptool
; writes the firmware to 0x10000 (clobbering NVS) → crash loop.
board_upload.offset_address = 0x20000

; Custom partition table (dual OTA banks + dual LittleFS partitions)
board_build.partitions  = partitions.csv
; Web assets are stored on the active LittleFS partition (lfs0/lfs1).
; IMPORTANT: "pio run -t uploadfs" always writes to lfs1 (0x520000) regardless
; of the active OTA bank.  For development (firmware in app0/bank-A), upload
; the web assets to lfs0 (0x420000) directly with esptool:
;   python %USERPROFILE%\.platformio\packages\tool-esptoolpy\esptool.py \
;     --chip esp32s3 --port COM8 --baud 460800 \
;     write_flash 0x420000 .pio\build\lolin_s3\littlefs.bin
board_build.filesystem  = littlefs

; LOLIN S3 uses QIO flash + OPI (octal) PSRAM — must match the SDK variant or
; the PSRAM init aborts before app_main() (rst:0x3 / Saved PC:0x403cdb0a).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Iconfig
    -DCONFIG_NVS_LOG_CAPACITY=250
    -DFIRMWARE_VERSION=\"1.16.39\"

; Local driver libraries (LIB-1 through LIB-11).
; PlatformIO scans the direct children of lib_extra_dirs entries.
; Pointing at ../drivers makes each driver/ subdirectory a candidate library;
; PlatformIO compiles each driver's src/ and ignores its test/ and .pio/ dirs.
lib_extra_dirs = ../drivers

; Exclude Arduino's built-in WebServer library — ESPAsyncWebServer is a
; replacement, not a consumer; the built-in WebServer causes WiFiServer.h
; resolution errors when pulled in automatically by the LDF.
lib_ignore = WebServer

; Registered library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3          ; WS2812B RGB LED on GPIO38 (PIN_RGB_LED) via RMT
    mathieucarbou/ESPAsyncWebServer @ ^3.3.6       ; Async web server — IDF5/Arduino-3 compatible fork (T11)
    mathieucarbou/AsyncTCP @ ^3.3.2                ; Async TCP layer required by ESPAsyncWebServer (T11)

; =============================================================================
; T2 Relay Controller on-device integration test environment
;
; Flashes a test firmware to the board, runs Unity test cases via serial,
; and reports pass/fail.  PlatformIO automatically excludes main.cpp from
; test builds; all other src files are compiled normally, so no
; build_src_filter is needed.  The test file (test/test_t2_relay/) defines
; all RTOS handles that app_types.h declares extern.
;
; Run:   pio test -e test_t2_relay
; Monitor (during interactive tests): pio device monitor -e test_t2_relay
;
; Expected duration:
;   ~185 s  boot calibration (M3 travel 171 s + 5 s margin)
;   ~30 s   two interactive alarm tests (15 s user window each)
;   < 5 s   remaining automated tests
;   Total:  ~3.5 min automated  +  user reaction time for IT-07 and IT-09
; =============================================================================

[env:test_t2_relay]
platform  = espressif32
board     = lolin_s3
framework = arduino

monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 0

upload_protocol = esptool
board_upload.offset_address     = 0x20000
board_build.partitions          = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Iconfig
    -DCONFIG_NVS_LOG_CAPACITY=250
    -DFIRMWARE_VERSION=\"1.16.39\"

lib_extra_dirs = ../drivers
lib_ignore     = WebServer

; Same lib_deps as lolin_s3 so all task stubs (web_server, etc.) compile.
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    mathieucarbou/ESPAsyncWebServer @ ^3.3.6
    mathieucarbou/AsyncTCP @ ^3.3.2

; pio test skips src/ compilation unless test_build_src = yes.
; build_src_filter then applies: include everything, exclude main.cpp to
; avoid a duplicate setup()/loop() symbol (the test file provides its own).
test_build_src   = yes
build_src_filter = +<**> -<main.cpp>
