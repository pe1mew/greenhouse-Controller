; PlatformIO Project Configuration
; Greenhouse Ventilation Controller
; Target board: WEMOS LOLIN S3 (ESP32-S3, 16 MB flash, 8 MB PSRAM)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:lolin_s3]
platform  = espressif32
board     = lolin_s3
framework = arduino

; Serial monitor — DTR=1 asserts "host connected" to the ESP32-S3 USB-CDC
; so Serial.print() calls work when the monitor is open.
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 0

; Upload via USB (native USB-C port on LOLIN S3)
upload_protocol = esptool

; Our custom partition table places app0 at 0x20000 (not the default 0x10000)
; because the NVS partition is 84 KB.  Without this, esptool writes the firmware
; to 0x10000 but the bootloader looks for the app at 0x20000 → crash loop.
board_upload.offset_address = 0x20000

; Custom partition table (dual OTA banks + dual LittleFS partitions)
board_build.partitions = partitions.csv

; LOLIN S3 uses QIO flash + OPI (octal) PSRAM — must match the SDK variant or
; the PSRAM init aborts before app_main() (rst:0x3 / Saved PC:0x403cdb0a).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Iconfig
    -DCONFIG_NVS_LOG_CAPACITY=250

; Local driver libraries (LIB-1 through LIB-11).
; PlatformIO scans the direct children of lib_extra_dirs entries.
; Pointing at ../drivers makes each driver/ subdirectory a candidate library;
; PlatformIO compiles each driver's src/ and ignores its test/ and .pio/ dirs.
lib_extra_dirs = ../drivers

; Exclude Arduino's built-in WebServer library — ESPAsyncWebServer is a
; replacement, not a consumer; the built-in WebServer causes WiFiServer.h
; resolution errors when pulled in automatically by the LDF.
lib_ignore = WebServer

; Registered library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3          ; WS2812B RGB LED on GPIO38 (PIN_RGB_LED) via RMT
    mathieucarbou/ESPAsyncWebServer @ ^3.3.6       ; Async web server — IDF5/Arduino-3 compatible fork (T11)
    mathieucarbou/AsyncTCP @ ^3.3.2                ; Async TCP layer required by ESPAsyncWebServer (T11)
