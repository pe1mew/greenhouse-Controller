; drivers/m3Char — the arithmetic of M3's characterisation run (plan §5e)
;
; Pure computation: no bus, no GPIO, no ESP-IDF, and deliberately NO
; -I../../firmware/config, by the same rule as drivers/ventModel: the firmware's
; limits arrive as parameters. The run itself (commanding M3, the rest, the
; guards, the hold) is firmware: window_pos/characterise.cpp.
;
; Host unit tests (no hardware):
;     pio test -e native
;
; They replay the rig's archived raw data (test/data/, see its README.md) and
; must reproduce what bin/at_wp_minmove.py and bin/at_wp02.py printed for it.
; test/test_m3_char/fixtures.h is GENERATED from that data by
; tools/gen_fixtures.py; regenerate it, never edit it.
;
; There is no lolin_s3 environment here on purpose -- there is nothing to
; exercise on a board that the host cannot exercise faster.

[env:native]
platform       = native
build_flags    = -DUNIT_TEST -DNATIVE_TEST -I src -Wall -Wextra
test_framework = unity
test_filter    = test_m3_char*
build_type     = release
; Nothing to mock, so the library is compiled straight into the test build,
; as drivers/ventModel's is.
test_build_src = yes
; Point at the Code::Blocks MinGW toolchain, as the other driver libraries do.
extra_scripts  = pre:set_compiler.py
